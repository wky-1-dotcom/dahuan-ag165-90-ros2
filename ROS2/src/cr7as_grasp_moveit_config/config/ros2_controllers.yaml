controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController


arm_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false

    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01


gripper_controller:
  ros__parameters:
    # Only the left outer knuckle is actively commanded.
    # The right-side joints are URDF mimic joints.
    joints:
      - ag165_joint1_left

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false

    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.01

      ag165_joint1_left:
        trajectory: 0.02
        goal: 0.01
