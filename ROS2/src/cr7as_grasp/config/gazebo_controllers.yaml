controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
    
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.20
      j1:
        trajectory: 0.05
        goal: 0.02
      j2:
        trajectory: 0.05
        goal: 0.02
      j3:
        trajectory: 0.05
        goal: 0.02
      j4:
        trajectory: 0.05
        goal: 0.02
      # Temporary diagnostic margin: previous place execution aborted at
      # a 0.0628 rad j5 tracking error with a 0.05 rad path tolerance.
      j5:
        trajectory: 0.08
        goal: 0.02
      j6:
        trajectory: 0.05
        goal: 0.02

gripper_controller:
  ros__parameters:
    joints:
      - dh_left_outer_knuckle_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: false
       
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.20
      
      dh_left_outer_knuckle_joint:
        trajectory: 0.05
        goal: 0.02

 
